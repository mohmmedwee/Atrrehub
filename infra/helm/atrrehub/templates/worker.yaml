apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atrrehub.fullname" . }}-worker
  labels: {{- include "atrrehub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "atrrehub.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "atrrehub.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      # Draining an in-flight workflow step matters more than a fast rollout.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}/api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "atrrehub.env" . | nindent 12 }}
            - name: WORKERS_ENABLED
              value: "true"
            - name: WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            - name: API_PORT
              value: "4001"
          livenessProbe:
            httpGet: { path: /healthz, port: 4001 }
            initialDelaySeconds: 25
            periodSeconds: 20
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
