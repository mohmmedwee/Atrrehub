{{/*
Migrations run as a pre-upgrade hook so the schema is in place before any new
pod serves traffic, and a failed migration aborts the release rather than
leaving a half-upgraded cluster.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "atrrehub.fullname" . }}-migrate-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}/api:{{ .Values.image.tag }}"
          command: ["node_modules/.bin/prisma", "migrate", "deploy"]
          env:
            {{- include "atrrehub.env" . | nindent 12 }}
