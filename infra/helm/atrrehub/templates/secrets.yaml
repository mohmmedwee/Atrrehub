{{- if not .Values.secrets.existingSecret }}
{{/*
A convenience secret for evaluation only. Production installs should set
secrets.existingSecret and manage the values with a sealed secret, an external
secrets operator, or the platform's own secret manager.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atrrehub.fullname" . }}-secrets
type: Opaque
stringData:
  databaseUrl: {{ .Values.secrets.databaseUrl | quote }}
  redisUrl: {{ .Values.secrets.redisUrl | quote }}
  jwtSecret: {{ .Values.secrets.jwtSecret | quote }}
  encryptionKey: {{ .Values.secrets.encryptionKey | quote }}
  widgetTokenSecret: {{ .Values.secrets.widgetTokenSecret | quote }}
  openaiApiKey: {{ .Values.secrets.openaiApiKey | quote }}
  anthropicApiKey: {{ .Values.secrets.anthropicApiKey | quote }}
{{- end }}
